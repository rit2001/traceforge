services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1G

  traceforge-worker:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    command: ["traceforge", "worker", "kafka", "--bootstrap-servers", "kafka:19092", "--database", "/data/assembly.sqlite3", "--capsule-directory", "/data/capsules"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ${TRACEFORGE_DATA_DIR:-./.traceforge-data}:/data
    restart: unless-stopped

  traceforge-api:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ${TRACEFORGE_DATA_DIR:-./.traceforge-data}:/data
    environment:
      TRACEFORGE_HISTORY_PATH: /data/history.sqlite3

volumes:
  kafka-data:
