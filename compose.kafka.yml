services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1G

  traceforge-worker:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    command: ["traceforge", "worker", "kafka", "--bootstrap-servers", "kafka:19092", "--database", "/data/assembly.sqlite3", "--capsule-directory", "/data/capsules"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ${TRACEFORGE_DATA_DIR:-./.traceforge-data}:/data
    restart: unless-stopped
    environment:
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      TRACEFORGE_WORKER_METRICS_PORT: "9464"
    ports:
      - "127.0.0.1:19464:9464"
    healthcheck:
      disable: true

  traceforge-api:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ${TRACEFORGE_DATA_DIR:-./.traceforge-data}:/data
    environment:
      TRACEFORGE_HISTORY_PATH: /data/history.sqlite3
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"

  ingest-gateway:
    build:
      context: .
      dockerfile: services/ingest-gateway/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SDK_DISABLED: "false"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          memory: 128M

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./services/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ${TRACEFORGE_DATA_DIR:-./.traceforge-data}/otel:/var/lib/otel
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  kafka-data:
