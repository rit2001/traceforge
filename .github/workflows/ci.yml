name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python format, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev,dashboard,langgraph]"
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: python -m compileall -q src tests scripts
      - run: python -m pytest

  go-tests:
    name: Go format, vet, tests, race, and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/ingest-gateway/go.mod
          cache-dependency-path: services/ingest-gateway/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out

  terraform-static:
    name: Terraform and static infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/environments/kind init -backend=false
      - run: terraform -chdir=infra/terraform/environments/kind validate
      - run: terraform -chdir=infra/terraform/environments/kind test
      - run: ./scripts/kubernetes/validate.sh
      - run: kubectl kustomize deploy/kubernetes/overlays/terraform-kind >/dev/null
      - run: ./scripts/terraform/check-ownership.sh

  markdown-links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_markdown_links.py

  package-build:
    name: Build and inspect Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m zipfile -l dist/traceforge_replay-0.4.1-py3-none-any.whl
      - run: python -m venv /tmp/traceforge-release-smoke
      - run: /tmp/traceforge-release-smoke/bin/pip install "dist/traceforge_replay-0.4.1-py3-none-any.whl[dev,dashboard,langgraph]"
      - run: /tmp/traceforge-release-smoke/bin/traceforge --version
      - run: /tmp/traceforge-release-smoke/bin/traceforge --help
      - run: /tmp/traceforge-release-smoke/bin/traceforge validate examples/weather/replay-capsule.json
      - run: /tmp/traceforge-release-smoke/bin/traceforge replay examples/weather/replay-capsule.json --runner traceforge.examples.weather_agent:run --spec examples/weather/regression-spec.json
