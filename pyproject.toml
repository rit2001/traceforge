[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge-replay"
version = "0.1.0"
description = "Local Replay Capsule validation and sealing feasibility MVP"
requires-python = ">=3.10"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "rfc8785>=0.1.2,<1",
]

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<1",
]
langgraph = ["langgraph>=0.2,<2"]
kafka = ["confluent-kafka>=2.6,<3"]
observability = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
  "prometheus-client>=0.21,<1",
]
dev = [
  "httpx>=0.27,<1",
  "opentelemetry-sdk>=1.30,<2",
  "prometheus-client>=0.21,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
traceforge = "traceforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/traceforge/schemas" = [
  "schemas/capture-event-v0.schema.json",
  "schemas/replay-capsule-v0.schema.json",
]

[tool.setuptools.package-data]
traceforge = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
