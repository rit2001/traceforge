[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.1.0"
description = "Local Replay Capsule validation and sealing feasibility MVP"
requires-python = ">=3.10"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "rfc8785>=0.1.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
traceforge = "traceforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/traceforge/schemas" = ["schemas/replay-capsule-v0.schema.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
