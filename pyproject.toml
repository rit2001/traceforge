[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge-replay"
dynamic = ["version"]
description = "Deterministic offline replay and regression export for failed Python agent runs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["agents", "deterministic-replay", "langgraph", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "rfc8785>=0.1.2,<1",
]

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<1",
]
langgraph = ["langgraph>=0.2,<2"]
kafka = ["confluent-kafka>=2.6,<3"]
observability = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
  "prometheus-client>=0.21,<1",
]
dev = [
  "httpx>=0.27,<1",
  "opentelemetry-sdk>=1.30,<2",
  "prometheus-client>=0.21,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
traceforge = "traceforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "traceforge.__version__"}

[tool.setuptools.data-files]
"share/traceforge/schemas" = [
  "schemas/capture-event-v0.schema.json",
  "schemas/capture-event-v0.3.schema.json",
  "schemas/replay-capsule-v0.schema.json",
  "schemas/replay-capsule-v0.2.schema.json",
  "schemas/replay-capsule-v0.3.schema.json",
]
"share/traceforge/examples/weather" = [
  "examples/weather/replay-capsule.json",
  "examples/weather/regression-spec.json",
]
"share/traceforge/examples/rag-citation" = [
  "examples/rag-citation/replay-capsule.json",
  "examples/rag-citation/regression-spec.json",
]
"share/traceforge/examples/tool-argument-safety" = [
  "examples/tool-argument-safety/replay-capsule.json",
  "examples/tool-argument-safety/regression-spec.json",
]

[tool.setuptools.package-data]
traceforge = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
