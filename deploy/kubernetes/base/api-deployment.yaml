apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceforge-api
  labels:
    app.kubernetes.io/name: traceforge-api
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traceforge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traceforge-api
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: traceforge-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: traceforge/python:0.3.0-local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: api-config
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: traceforge-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: traceforge-data
          persistentVolumeClaim:
            claimName: traceforge-data
        - name: tmp
          emptyDir: {}
