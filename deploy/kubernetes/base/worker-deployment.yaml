apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceforge-worker
  labels:
    app.kubernetes.io/name: traceforge-worker
    app.kubernetes.io/component: capsule-assembly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: traceforge-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traceforge-worker
        app.kubernetes.io/component: capsule-assembly
    spec:
      serviceAccountName: traceforge-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: traceforge/python:0.3.0-local
          imagePullPolicy: Never
          args:
            - traceforge
            - worker
            - kafka
            - --bootstrap-servers
            - kafka:19092
            - --database
            - /data/assembly.sqlite3
            - --capsule-directory
            - /data/capsules
          envFrom:
            - configMapRef:
                name: worker-config
          ports:
            - name: metrics
              containerPort: 9464
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: traceforge-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: traceforge-data
          persistentVolumeClaim:
            claimName: traceforge-data
        - name: tmp
          emptyDir: {}
